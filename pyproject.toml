[project]
name = "deepseek-vision"
version = "0.1.0"
description = "Provider-independent multimodal media analysis built on DeepSeek V4 Flash Vision Exp"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pymupdf>=1.24",
    "pillow>=10",
]

[project.scripts]
deepseek-vision = "deepseek_vision.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepseek_vision"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
